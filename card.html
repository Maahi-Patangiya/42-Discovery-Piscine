<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portfolio Card</title>
  <link rel="stylesheet" href="card.css" />
</head>
<body>
  <div class="portfolio-card">
    <div class="card-inner">
      <div class="card-front">
        <h1>Your Name</h1>
        <p>Hi, I’m [Your Name]. I’m a [Your Role]. Welcome to my portfolio.</p>
      </div>
      <div class="card-back">
        <h1>Friend’s Name</h1>
        <p>Meet my friend, [Friend’s Name]. [Brief intro about them].</p>
      </div>
    </div>
  </div>
</body>
</html>
