<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF‑8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rotating Profile Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="card.css" />
</head>
<body>
  <div class="portfolio-card">
    <div class="card-inner">
      <!-- Front Face - MaaP -->
      <div class="card-face card-front">
        <div class="card-content">
          <div class="profile-area">
            <div class="curved-text">MaaP</div>
            <div class="profile-icon"></div>
          </div>
          <div class="about-text">
            <h2>About MaaP</h2>
            <p>Creative developer with a passion for animation, design, and frontend craft. Always curious, always building.</p>
          </div>
        </div>
      </div>

      <!-- Back Face - SamK -->
      <div class="card-face card-back">
        <div class="card-content">
          <div class="profile-area">
            <div class="curved-text">SamK</div>
            <div class="profile-icon"></div>
          </div>
          <div class="about-text">
            <h2>About SamK</h2>
            <p>Design-minded engineer who blends technical rigor with a love for color, form, and subtlety in interfaces.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
